<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <script src="./config.js"></script>
    <script src="./script.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="weatherWidget">
        <div id="currentCity"></div>
        <div id="currentStateRegion"></div>
        <div class="currentConditions">
            <div class="mainParameters">
                <div class="icon_and_temp">
                    <span id="currentWeatherIcon"></span>
                    <div id="currentTemperature"><span id="currentTemperatureValue"></span> &deg;C</div>
                    <div id="currentTemperatureFeelsLike">Ощущается как: <span id="currentTemperatureFeelsLikeValue"></span> &deg;C</div>
                </div>
            </div>
            <div class="topRight">
                <div class="spacer"></div>
                <div class="additionalParametersContainer">
                    <div class="additional_parameters">
                        <div id="currentHumidity">Относительная влажность: <span id="currentHumidityValue"></span> %</div>
                        <div id="currentPressure">Атмосферное давление: <span id="currentPressureValue"></span> мм рт. ст.</div>
                        <div id="currentWindSpeed">Скорость ветра: <span id="currentWindSpeedValue"></span> м/с</div>
                        <div id="currentVisibility">Видимость: <span id="currentVisibilityValue"></span> км</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="currentConditions_placeholder" role="status">
            <p>ПОЖАЛУСТО, ПАДОЖДИТЕ</p>
            <p>ЗАГРУЖОВЫВАВЫЮ ДАТУ</p>
            <p>.....</p>
        </div>
        <div class="errorMessage" style="display: none;" role="alert"></div>
        <div class="bottom">
            <div class="nextDays">
                <div class="nextDay_placeholder">ПЛЕАЗЕ</div>
                <div class="nextDay_placeholder">ВАЙТ</div>
                <div class="nextDay_placeholder">ЛОАДИНГ</div>
                <div class="nextDay_placeholder">ДАТА</div>
                <div class="nextDay_placeholder">.........</div>
            </div>
        </div>
        <button type="button" class="btn" id="toggleWidget" aria-label="Свернуть или развернуть подробности">&gt;</button>
    </div>
    <template id="nextDayTemplate">
        <div class="nextDay">
            <span class="dayDate"></span>
            <img class="dayIcon" src="" alt="">
            <br><span class="dayMinTemp"></span> &deg;C..<span class="dayMaxTemp"></span> &deg;C
        </div>
    </template>
    <div class="options">
        <input type="checkbox" id="showAdditionalParameters" checked>
        <label for="showAdditionalParameters">Показывать подробную информацию о погоде</label>
    </div>
    <script src="checkboxes.js"></script>
</body>

</html>
